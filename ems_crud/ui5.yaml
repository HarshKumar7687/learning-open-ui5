specVersion: "3.0"

metadata:
  name: employee-management-system

type: application

framework:
  name: OpenUI5
  version: "1.120.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: themelib_sap_horizon
    - name: sap.uxap

builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion

server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression